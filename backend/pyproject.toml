[project]
name = "ytmp3ex-backend"
version = "0.1.0"
description = "Local backend for YouTube to MP3 conversion"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
