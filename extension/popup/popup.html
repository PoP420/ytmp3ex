<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytmp3ex</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>ytmp3ex</h1>
      <span id="backendStatus" class="status-dot" title="Backend"></span>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="convert">Convert</button>
      <button class="tab" data-tab="queue">Queue</button>
      <button class="tab" data-tab="history">History</button>
    </div>

    <section id="tab-convert" class="tab-content active">
      <div class="form-group">
        <input type="text" id="url" placeholder="Paste YouTube URL..." />
        <button id="convertBtn">Convert</button>
      </div>
      <div id="status" class="status">Ready</div>
      <div id="currentProgress" class="progress hidden">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressText" class="progress-text">0%</div>
      </div>
    </section>

    <section id="tab-queue" class="tab-content">
      <div id="queueList" class="list">
        <div class="empty">No active conversions</div>
      </div>
    </section>

    <section id="tab-history" class="tab-content">
      <div id="historyList" class="list">
        <div class="empty">No history yet</div>
      </div>
    </section>

    <footer class="footer">
      <a id="settingsLink" href="#" target="_blank">Settings</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
