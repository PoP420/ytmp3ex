<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ytmp3ex Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 500; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { padding: 10px 18px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1e293b; }
    .status { margin-top: 12px; font-size: 13px; color: #16a34a; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <label>Backend URL
    <input id="backend" type="text" placeholder="http://localhost:8000" />
  </label>
  <label>Quality (kbps)
    <input id="quality" type="text" placeholder="192" />
  </label>
  <label>
    <input id="autoConvert" type="checkbox" /> Auto convert on YouTube page
  </label>
  <button id="save">Save</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
